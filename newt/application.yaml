apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: newt
  namespace: argocd
  annotations:
    # No CRD dependency of its own beyond the out-of-band Bitwarden operator;
    # kept out of wave 0 so the operator installs alone. See root.yaml.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    # BitwardenSecret CR -> newt-main-tunnel-auth Secret
    - repoURL: https://github.com/yoyozbi-homelab/argocd-config.git
      targetRevision: HEAD
      path: newt/manifests
    - chart: newt
      repoURL: https://charts.fossorial.io
      targetRevision: 1.5.0
      helm:
        releaseName: newt
        valuesObject:
          global:
            # Apply chart resources after the BitwardenSecret (wave 0).
            # Ordering only -- ArgoCD reports the CR healthy on apply, so it
            # does not wait for the operator to write newt-main-tunnel-auth.
            additionalAnnotations:
              argocd.argoproj.io/sync-wave: "2"
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
                ephemeral-storage: 256Mi
              requests:
                cpu: 25m
                memory: 128Mi
                ephemeral-storage: 128Mi
          newtInstances:
            - name: main-tunnel
              enabled: true
              acceptClients: true
              auth:
                existingSecretName: newt-main-tunnel-auth
  destination:
    server: "https://kubernetes.default.svc"
    namespace: newt
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    managedNamespaceMetadata:
      labels:
        bitwarden-secrets: enabled # reflector mirrors bw-auth-token in here
    syncOptions:
      - CreateNamespace=true
