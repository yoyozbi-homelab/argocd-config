# Pulls the newt tunnel credentials out of Bitwarden Secrets Manager and
# materialises them as the `newt-main-tunnel-auth` Secret consumed by the chart
# (newtInstances[].auth.existingSecretName).
#
# Only the three mapped secrets are mirrored; anything else in the project is
# ignored. Both flags are set explicitly because the CRD defaults
# onlyMappedSecrets to true and the two options are mutually exclusive.
#
# `bw-auth-token` is mirrored into this namespace by reflector, which keys off
# the `bitwarden-secrets: enabled` label set via the Application's
# managedNamespaceMetadata.
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: newt-secrets
  namespace: newt
spec:
  organizationId: "85aba0b7-1054-4762-a7ef-ad4b0164a51c"
  projectId: "89f8e852-312a-4e95-9ac3-b4ae008a2dc8"
  secretName: newt-main-tunnel-auth
  useSecretNames: false
  onlyMappedSecrets: true
  map:
    - bwSecretId: "e3444699-27f7-436a-b954-b4b5009b5eed"
      secretKeyName: PANGOLIN_ENDPOINT
    - bwSecretId: "2d0ced07-1c72-4840-bda3-b4b5009b749e"
      secretKeyName: NEWT_ID
    - bwSecretId: "206f0375-9535-4132-ab5d-b4b5009b84e5"
      secretKeyName: NEWT_SECRET
  authToken:
    secretName: bw-auth-token
    secretKey: token
