# Single-instance Postgres for paperless, run by the CNPG operator that the
# cpng Application installs cluster-wide.
#
# Deliberately minimal compared to the shared main-cluster on ocr1: one app, one
# replica, so no managed roles, no replication slots and no monitoring queries.
#
# CNPG generates the Secret paperless-db-app (keys username / password / dbname /
# host / port) and the Service paperless-db-rw. Both are consumed by the chart
# values in ../application.yaml.
#
# Storage binds the paperless-db hostPath PV via the paperless-hostpath class.
# The instance runs as UID/GID 26, so /mnt/data/paperless-db must be chowned to
# 26:26 on the host before the first sync.
#
# SkipDryRunOnMissingResource is required for a fresh cluster: the
# postgresql.cnpg.io CRDs come from the separate cnpg Application, so on a first
# install they do not exist yet. Without this, ArgoCD's dry-run fails on this one
# resource and aborts the entire paperless sync -- not even the StorageClass, PVs
# or Valkey get created. With it, everything else applies and this Cluster lands
# on a retry once the operator's CRDs are in place.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-db
  namespace: paperless
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: paperless
      owner: paperless
      encoding: UTF8
  storage:
    storageClass: paperless-hostpath
    size: 5Gi
