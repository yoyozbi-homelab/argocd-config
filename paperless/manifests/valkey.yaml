# Task broker for paperless-ngx.
#
# The chart ships no Redis of its own -- it only exposes redis.connectionUrl --
# so we run a minimal Valkey here.
#
# Storage is emptyDir on purpose: this holds the celery queue and channel layer,
# which is disposable state that rebuilds itself. It does not belong on the
# external disk. Persistence is switched off in the server args to match, so
# Valkey never tries to write an RDB snapshot it cannot keep.
#
# Security context mirrors what the paperless chart already enforces on its own
# pod. /data is the only writable path, which readOnlyRootFilesystem allows
# because it is the mounted emptyDir.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-valkey
  namespace: paperless
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: paperless
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/part-of: paperless
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/part-of: paperless
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          imagePullPolicy: IfNotPresent
          args:
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: valkey
              containerPort: 6379
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-valkey
  namespace: paperless
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: paperless
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: paperless
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
      protocol: TCP
