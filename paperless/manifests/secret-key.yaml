# PAPERLESS_SECRET_KEY, sourced from Bitwarden Secrets Manager.
#
# The chart can generate this itself (hosting.secretKey.create), but its template
# falls back to randAlphaNum 64 whenever its `lookup` comes back empty -- and
# ArgoCD renders with `helm template`, where `lookup` is always empty. That
# yields a fresh key on every refresh: a permanent diff that selfHeal acts on,
# invalidating every session. So the chart's generator is disabled and the key
# comes from here instead.
#
# The Bitwarden secret should hold 64 random characters. Both flags are set
# explicitly because the CRD defaults onlyMappedSecrets to true and the two
# options are mutually exclusive.
#
# `bw-auth-token` is mirrored into this namespace by reflector, which keys off
# the `bitwarden-secrets: enabled` label set via the Application's
# managedNamespaceMetadata.
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: paperless-secret-key
  namespace: paperless
spec:
  organizationId: "85aba0b7-1054-4762-a7ef-ad4b0164a51c"
  projectId: "89f8e852-312a-4e95-9ac3-b4ae008a2dc8"
  secretName: paperless-secret-key
  useSecretNames: false
  onlyMappedSecrets: true
  map:
    - bwSecretId: "fd4a6fa7-1ba2-4315-bea2-b4b500b73eb8"
      secretKeyName: key
  authToken:
    secretName: bw-auth-token
    secretKey: token
