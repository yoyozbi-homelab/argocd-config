apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paperless
  namespace: argocd
  annotations:
    # Declares a CNPG Cluster, so it must not be applied until the cnpg app
    # (wave 0) is Healthy and its CRDs exist. See root.yaml.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    # StorageClass + hostPath PVs/PVCs, CNPG Cluster, Valkey, BitwardenSecret
    - repoURL: https://github.com/yoyozbi-homelab/argocd-config.git
      targetRevision: HEAD
      path: paperless/manifests
    - chart: paperless-ngx
      repoURL: https://charts.derwitt.dev
      targetRevision: 2.1.1
      helm:
        releaseName: paperless
        valuesObject:
          tweaks:
            timezone: Europe/Zurich
          database:
            engine: postgresql
            host: paperless-db-rw
            port: 5432
            databaseName: paperless
            # Both sourced from the Secret CNPG generates for the cluster.
            userSecret:
              name: paperless-db-app
              key: username
            passwordSecret:
              name: paperless-db-app
              key: password
          redis:
            connectionUrl: redis://paperless-valkey:6379
          hosting:
            # Generated key disabled -- the chart's template re-randomises it on
            # every ArgoCD render. Supplied from Bitwarden instead.
            secretKey:
              create: false
              name: paperless-secret-key
              key: key
            # Without this allauth cannot determine the client IP behind Traefik
            # and returns 403 on login.
            trustedClientIpHeader: X-Forwarded-For
          persistence:
            data:
              enabled: true
              existingVolumeClaim: paperless-data
            media:
              enabled: true
              existingVolumeClaim: paperless-media
            consume:
              enabled: true
              existingVolumeClaim: paperless-consume
          # This node serves its first request ~20s after boot (aarch64, and the
          # container's own init takes ~180s). The chart sets no timeoutSeconds on
          # either probe, so both inherit Kubernetes' 1s default and can never
          # succeed -- every attempt disconnects mid-request, which surfaces in the
          # logs as an asyncio CancelledError from asgiref. The chart templates no
          # startupProbe, so the slow start has to be absorbed here.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 300
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 5
          ingress:
            enabled: true
            className: traefik
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: web
            hosts:
              - host: paperless.yohanzbinden.ch
                paths:
                  - path: /
                    pathType: Prefix
  destination:
    server: "https://kubernetes.default.svc"
    namespace: paperless
  # The PVs pre-bind their PVCs via claimRef so each claim lands on the volume
  # meant for it. On binding the PV controller stamps uid and resourceVersion
  # into that claimRef, which ArgoCD then reports as permanent drift.
  ignoreDifferences:
    - group: ""
      kind: PersistentVolume
      jsonPointers:
        - /spec/claimRef/uid
        - /spec/claimRef/resourceVersion
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # On a fresh cluster the CNPG Cluster cannot apply until the cnpg
    # Application has installed its CRDs. Retry until it converges instead of
    # leaving the app failed.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    managedNamespaceMetadata:
      labels:
        bitwarden-secrets: enabled # reflector mirrors bw-auth-token in here
    syncOptions:
      - CreateNamespace=true
